name: JODLO native Android APK compile (no deployment)
on:
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-native.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved flat UI rules
        run: node scripts/verify-approved-flat-ui.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK platform and build tools (local build only)
        run: |
          test -n "$ANDROID_HOME"
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile real Android debug APK (no production signing or deployment)
        run: gradle -p apps/android -PincludeAndroidApp=true :app:assembleDebug --no-daemon
      - name: Verify APK and Java 17 bytecode on selected JDK
        run: |
          test -s apps/android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum apps/android/app/build/outputs/apk/debug/app-debug.apk
          CORE_CLASS="$(find apps/android/core/build/classes/kotlin/main -type f -name '*.class' -print -quit)"
          test -n "$CORE_CLASS"
          javap -verbose "$CORE_CLASS" | grep -q 'major version: 61'
      - name: Run Kotlin Core verification under JDK 21
        if: matrix.java-version == '21'
        run: gradle -p apps/android :core:verifyHeadlessCore --no-daemon
      - name: Compile the optional Agora voice integration
        if: matrix.java-version == '21'
        run: gradle -p apps/android -PincludeAndroidApp=true -PjodloEnableAgora=true :app:compileDebugKotlin --no-daemon
      - name: Compile optional Play Billing 9.1 read-only client (no checkout)
        if: matrix.java-version == '21'
        run: gradle -p apps/android -PincludeAndroidApp=true -PjodloEnablePlayBilling=true :app:compileDebugKotlin --no-daemon
      - name: Compile FCM and Agora together using synthetic CI-only Firebase configuration
        if: matrix.java-version == '21'
        run: |
          CONFIG=apps/android/app/google-services.json
          test ! -e "$CONFIG"
          trap 'rm -f "$CONFIG"' EXIT
          cat > "$CONFIG" <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "jodlo-ci-synthetic-not-real"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                "android_client_info": {"package_name": "com.rekixo.jodlo"}
              },
              "api_key": [{"current_key": "synthetic-not-a-real-credential"}]
            }],
            "configuration_version": "1"
          }
          JSON
          gradle -p apps/android -PincludeAndroidApp=true -PjodloEnableAgora=true -PjodloEnableFcm=true :app:assembleDebug --no-daemon
          test -s apps/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Save temporary debug APK for physical-device testing (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && matrix.java-version == '17'
        uses: actions/upload-artifact@v4
        with:
          name: jodlo-debug-apk-${{ github.sha }}
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
