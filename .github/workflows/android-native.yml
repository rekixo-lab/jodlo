name: JODLO native Android APK compile (no deployment)
on:
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-native.yml'
      - 'scripts/android-release-evidence.py'
      - 'scripts/android-release-evidence.test.mjs'
      - 'scripts/android-release-candidate-gate.test.mjs'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-native.yml'
      - 'scripts/android-release-evidence.py'
      - 'scripts/android-release-evidence.test.mjs'
      - 'scripts/android-release-candidate-gate.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jodlo-android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        java-version: ['17', '21']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify approved flat UI rules
        run: node scripts/verify-approved-flat-ui.mjs
      - name: Verify unsigned bundle evidence checks with synthetic fixtures
        run: python3 scripts/android-release-evidence.py --self-test
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK platform and build tools (local build only)
        run: |
          test -n "$ANDROID_HOME"
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Compile real Android debug APK (no production signing or deployment)
        run: gradle -p apps/android -PincludeAndroidApp=true :app:assembleDebug --no-daemon
      - name: Verify APK and Java 17 bytecode on selected JDK
        run: |
          test -s apps/android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum apps/android/app/build/outputs/apk/debug/app-debug.apk
          # Check the ACTUAL APK manifest, not only the Gradle source setting.
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging apps/android/app/build/outputs/apk/debug/app-debug.apk)"
          grep -Fq "targetSdkVersion:'36'" <<< "$BADGING"
          grep -Fq "sdkVersion:'26'" <<< "$BADGING"
          CORE_CLASS="$(find apps/android/core/build/classes/kotlin/main -type f -name '*.class' -print -quit)"
          test -n "$CORE_CLASS"
          javap -verbose "$CORE_CLASS" | grep -q 'major version: 61'
      - name: Ensure unconfigured release variants stay disabled
        if: matrix.java-version == '21'
        run: |
          gradle -p apps/android -PincludeAndroidApp=true :app:tasks --all --no-daemon > "$RUNNER_TEMP/jodlo-gradle-tasks.txt"
          if grep -Eq '^[[:space:]]*(assembleRelease|bundleRelease)([[:space:]]|$)' "$RUNNER_TEMP/jodlo-gradle-tasks.txt"; then
            echo "Unsafe: release Gradle tasks exist without owner configuration"
            exit 1
          fi
      - name: Reject release candidate without explicit operator settings
        if: matrix.java-version == '21'
        run: |
          if gradle -p apps/android -PincludeAndroidApp=true -PjodloReleaseCandidate=true :app:help --no-daemon > "$RUNNER_TEMP/jodlo-invalid-release.txt" 2>&1; then
            echo "Unsafe: release candidate accepted without backend/OAuth/version configuration"
            exit 1
          fi
          grep -q 'Release candidate requires the dedicated verified JODLO API origin' "$RUNNER_TEMP/jodlo-invalid-release.txt"
      - name: Verify configured release candidate tasks without building or signing
        if: matrix.java-version == '21'
        run: |
          # Synthetic/public values only. Task discovery cannot package, sign, upload
          # or run a release. This is NOT a production release configuration.
          CANDIDATE_ARGS=(
            -PincludeAndroidApp=true
            -PjodloReleaseCandidate=true
            -PjodloApiOrigin=https://api.jodlo.rekixo.com
            -PjodloGoogleWebClientId=123456789012-jodlo-ci-only.apps.googleusercontent.com
            -PjodloReleaseVersionName=1.0.0
            -PjodloReleaseVersionCode=2
          )
          gradle -p apps/android "${CANDIDATE_ARGS[@]}" :app:tasks --all --no-daemon > "$RUNNER_TEMP/jodlo-candidate-tasks.txt"
          grep -Eq '^[[:space:]]*assembleRelease([[:space:]]|$)' "$RUNNER_TEMP/jodlo-candidate-tasks.txt"
          grep -Eq '^[[:space:]]*bundleRelease([[:space:]]|$)' "$RUNNER_TEMP/jodlo-candidate-tasks.txt"
          # Valid origin/client are insufficient: any non-semver version must
          # fail before Gradle exposes a release candidate variant.
          CANDIDATE_ARGS[4]=-PjodloReleaseVersionName=dev
          if gradle -p apps/android "${CANDIDATE_ARGS[@]}" :app:help --no-daemon > "$RUNNER_TEMP/jodlo-bad-version.txt" 2>&1; then
            echo "Unsafe: invalid release version accepted"
            exit 1
          fi
          grep -q 'Release candidate needs explicit numeric major.minor.patch version name' "$RUNNER_TEMP/jodlo-bad-version.txt"
      - name: Run Kotlin Core verification under JDK 21
        if: matrix.java-version == '21'
        run: gradle -p apps/android :core:verifyHeadlessCore --no-daemon
      - name: Compile the optional Agora voice integration
        if: matrix.java-version == '21'
        run: gradle -p apps/android -PincludeAndroidApp=true -PjodloEnableAgora=true :app:compileDebugKotlin --no-daemon
      - name: Compile optional Play Billing 9.1 read-only client (no checkout)
        if: matrix.java-version == '21'
        run: gradle -p apps/android -PincludeAndroidApp=true -PjodloEnablePlayBilling=true :app:compileDebugKotlin --no-daemon
      - name: Compile manual Play restore UI in isolated configured QA debug mode (no payment)
        if: matrix.java-version == '21'
        run: |
          gradle -p apps/android -PincludeAndroidApp=true \
            -PjodloEnablePlayBilling=true -PjodloEnablePlayRestore=true \
            -PjodloApiOrigin=https://api.jodlo.example \
            -PjodloGoogleWebClientId=123456789012-ci-restore-only.apps.googleusercontent.com \
            :app:compileDebugKotlin --no-daemon
      - name: Compile configured checkout and recovery UI with synthetic public settings
        if: matrix.java-version == '21'
        run: |
          gradle -p apps/android -PincludeAndroidApp=true \
            -PjodloEnablePlayBilling=true -PjodloEnablePlayCheckout=true \
            -PjodloEnablePlayRestore=true -PjodloPlayPolicyVersion=jodlo-play-minutes-v1 \
            -PjodloApiOrigin=https://api.jodlo.example \
            -PjodloGoogleWebClientId=123456789012-ci-checkout-only.apps.googleusercontent.com \
            :app:compileDebugKotlin --no-daemon
      - name: Reject checkout without explicit settlement policy
        if: matrix.java-version == '21'
        run: |
          if gradle -p apps/android -PincludeAndroidApp=true \
            -PjodloEnablePlayBilling=true -PjodloEnablePlayCheckout=true \
            -PjodloApiOrigin=https://api.jodlo.example \
            -PjodloGoogleWebClientId=123456789012-ci-checkout-only.apps.googleusercontent.com \
            :app:help --no-daemon > "$RUNNER_TEMP/jodlo-checkout-missing-policy.txt" 2>&1; then
            echo "Unsafe: checkout configuration accepted without a policy version"
            exit 1
          fi
          grep -q 'Checkout requires configured Play Billing, API, Google identity and explicit settlement policy' "$RUNNER_TEMP/jodlo-checkout-missing-policy.txt"
      - name: Reject restored purchase UI in release candidates without the checkout policy
        if: matrix.java-version == '21'
        run: |
          if gradle -p apps/android -PincludeAndroidApp=true \
            -PjodloEnablePlayBilling=true -PjodloEnablePlayRestore=true \
            -PjodloReleaseCandidate=true \
            -PjodloApiOrigin=https://api.jodlo.rekixo.com \
            -PjodloGoogleWebClientId=123456789012-ci-restore-only.apps.googleusercontent.com \
            :app:help --no-daemon > "$RUNNER_TEMP/jodlo-restore-unsafe-release.txt" 2>&1; then
            echo "Unsafe: Play restore UI enabled in release candidate"
            exit 1
          fi
          grep -q 'Play recovery needs configured Billing; a release candidate also needs the explicit checkout policy' "$RUNNER_TEMP/jodlo-restore-unsafe-release.txt"
      - name: Compile disposable unsigned API 36 release AAB with synthetic config (never upload)
        if: matrix.java-version == '21'
        run: |
          # Offline build proof only. Synthetic Web OAuth and release values are
          # not operational credentials; do NOT sign, publish or upload this AAB.
          BUNDLE=apps/android/app/build/outputs/bundle/release/app-release.aab
          FIRST_BUNDLE="$RUNNER_TEMP/jodlo-unsigned-release-first.aab"
          trap 'rm -f "$BUNDLE" "$FIRST_BUNDLE"' EXIT
          BUNDLE_ARGS=(
            -PincludeAndroidApp=true
            -PjodloReleaseCandidate=true
            -PjodloApiOrigin=https://api.jodlo.rekixo.com
            -PjodloGoogleWebClientId=123456789012-jodlo-ci-only.apps.googleusercontent.com
            -PjodloReleaseVersionName=1.0.0
            -PjodloReleaseVersionCode=2
            -PjodloEnablePlayBilling=true
            -PjodloEnablePlayCheckout=true
            -PjodloEnablePlayRestore=true
            -PjodloPlayPolicyVersion=jodlo-play-minutes-v1
          )
          gradle -p apps/android "${BUNDLE_ARGS[@]}" :app:bundleRelease --no-daemon --no-build-cache
          test -s "$BUNDLE"
          unzip -Z -1 "$BUNDLE" | grep -Fxq 'base/manifest/AndroidManifest.xml'
          python3 scripts/android-release-evidence.py --inspect "$BUNDLE"
          cp "$BUNDLE" "$FIRST_BUNDLE"
          # Recompile inputs rather than trusting Gradle's cached task status.
          # Compare uncompressed member hashes; report ZIP-byte differences honestly.
          gradle -p apps/android "${BUNDLE_ARGS[@]}" :app:bundleRelease --no-daemon --no-build-cache --rerun-tasks
          python3 scripts/android-release-evidence.py --compare "$FIRST_BUNDLE" "$BUNDLE"
          # Refuse to hand a synthetic release AAB to later steps/artifacts.
          rm -f "$BUNDLE"
          rm -f "$FIRST_BUNDLE"
          test ! -e "$BUNDLE"
      - name: Compile FCM and Agora together using synthetic CI-only Firebase configuration
        if: matrix.java-version == '21'
        run: |
          CONFIG=apps/android/app/google-services.json
          COMBINED_BUNDLE=apps/android/app/build/outputs/bundle/release/app-release.aab
          test ! -e "$CONFIG"
          trap 'rm -f "$CONFIG" "$COMBINED_BUNDLE"' EXIT
          cat > "$CONFIG" <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "jodlo-ci-synthetic-not-real"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                "android_client_info": {"package_name": "com.rekixo.jodlo"}
              },
              "api_key": [{"current_key": "synthetic-not-a-real-credential"}]
            }],
            "configuration_version": "1"
          }
          JSON
          gradle -p apps/android -PincludeAndroidApp=true -PjodloEnableAgora=true -PjodloEnableFcm=true :app:assembleDebug --no-daemon
          test -s apps/android/app/build/outputs/apk/debug/app-debug.apk
          # Exercise provider source sets together in release build and packaging.
          # These public fixture values are never used to sign in or call a
          # provider, and the resulting unsigned bundle is deleted in this step.
          gradle -p apps/android -PincludeAndroidApp=true \
            -PjodloEnableAgora=true -PjodloEnableFcm=true \
            -PjodloEnablePlayBilling=true -PjodloEnablePlayCheckout=true \
            -PjodloEnablePlayRestore=true -PjodloPlayPolicyVersion=jodlo-play-minutes-v1 \
            -PjodloReleaseCandidate=true \
            -PjodloApiOrigin=https://api.jodlo.rekixo.com \
            -PjodloGoogleWebClientId=123456789012-jodlo-ci-only.apps.googleusercontent.com \
            -PjodloReleaseVersionName=1.0.0 -PjodloReleaseVersionCode=2 \
            :app:bundleRelease --no-daemon --no-build-cache
          test -s "$COMBINED_BUNDLE"
          python3 scripts/android-release-evidence.py --inspect "$COMBINED_BUNDLE"
          rm -f "$COMBINED_BUNDLE"
          test ! -e "$COMBINED_BUNDLE"
      - name: Save temporary debug APK for physical-device testing (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && matrix.java-version == '17'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jodlo-debug-apk-${{ github.sha }}
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
