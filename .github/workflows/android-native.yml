name: JODLO native Android APK compile (no deployment)
on:
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-native.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-native.yml'
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK platform and build tools (local build only)
        run: |
          test -n "$ANDROID_HOME"
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile real Android debug APK (never sign or distribute)
        run: gradle -p apps/android -PincludeAndroidApp=true :app:assembleDebug --no-daemon
