name: Deploy JODLO staging (manual, Cloudflare secrets required)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run docs:check
      - run: npm test
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npx wrangler deploy --dry-run --config apps/api/wrangler.staging.jsonc
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: jodlo-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Check Cloudflare secret availability (do not print values)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing protected CLOUDFLARE_API_TOKEN environment secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing protected CLOUDFLARE_ACCOUNT_ID environment secret"; exit 1; }
      - name: Deploy isolated jodlo-api-staging to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config apps/api/wrangler.staging.jsonc
      - name: Inspect deployment URL in Wrangler logs
        run: echo "Find the workers.dev preview URL in the Cloudflare/Wrangler job logs and verify /api/v1/health; never assume DNS is live."
