name: Temporary JODLO lockfile generation (no deployment)
on:
  push:
    branches: [build/lock-dependencies-npm-ci-20261030]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Resolve npm workspace lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Emit generated metadata for reviewed GitHub commit
        run: |
          node -e 'const f=require("node:fs");console.log("JODLO_LOCK_BEGIN");process.stdout.write(f.readFileSync("package-lock.json","utf8"));console.log("JODLO_LOCK_END");'
