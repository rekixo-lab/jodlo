name: JODLO foundation checks (no deployment)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate linked docs (no deps)
        run: npm run docs:check
      - name: Enforce design token and asset deduplication rules (no deps)
        run: npm run design:check
      - name: Enforce founder privacy, route, language and no-deploy safety (no deps)
        run: npm run founder:check
      - name: Verify uploaded historical bilingual catalog reference (no deps)
        run: npm run reference:check
      - name: Install dependencies (jose verified JWT library; no deployment)
        run: npm install --no-audit --no-fund
      - name: Node API and design-guard fixture tests
        run: npm test
      - name: Apply catalog D1 migrations locally (no remote resources)
        run: npm run db:migrate:local
      - name: Bundle local D1 Worker (never deploy)
        run: npm run db:build:local
      - name: TypeScript strict checks
        run: npm run typecheck
      - name: Install JDK 17 for nonvisual Kotlin protocol checks
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Gradle for Android-compatible Kotlin Core
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile Kotlin networking core and execute real JVM contract tests (no Android SDK or deployment)
        run: gradle -p apps/android :core:verifyContracts :core:verifyReplies :core:verifyRepositories :core:verifySessions :core:verifyAuthExchange :core:verifyCancellation :core:verifyReadScope :core:verifyWorkerWriteReview :core:verifyPublicRefresh :core:verifyPublicFreshness :core:verifyPagination :core:verifyCustomerSelection :core:verifyBackNavigation :core:verifyIntentRecovery :core:verifyDiscoveryE2E :core:verifyOfflineRecovery :core:verifyCustomerPresentation :core:verifyActorBoundaries :core:verifyWorkerDashboard --no-daemon
      - name: Wrangler bundle check (no deployment)
        run: npm run build:api
