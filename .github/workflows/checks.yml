name: JODLO foundation checks (no deployment)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: jodlo-foundation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Enforce read-only GitHub workflow trust boundary (no deps)
        run: node --test scripts/verify-ci-trust-boundary.test.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate linked docs (no deps)
        run: npm run docs:check
      - name: Test status-ledger guard against unsupported live or reviewer claims (no deps)
        run: node --test scripts/verify-current-state.test.mjs
      - name: Enforce founder-approved flat dark and outlined native UI (no deps)
        run: node scripts/verify-approved-flat-ui.mjs
      - name: Enforce design token and asset deduplication rules (no deps)
        run: npm run design:check
      - name: Enforce founder privacy, route, language and no-deploy safety (no deps)
        run: npm run founder:check
      - name: Verify committed first five full-Service reviewer handoff matches pinned source (no writes)
        run: node scripts/catalog-first-five-handoff.mjs --check
      - name: Verify uploaded historical bilingual catalog reference (no deps)
        run: npm run reference:check
      - name: Enforce exhaustive Kotlin JVM suite wiring (no deps)
        run: npm run kotlin:coverage-check
      - name: Verify npm workspace lockfile metadata before network install
        run: npm run lock:check
      - name: Fail if required npm audit policy is weakened or bypassed
        run: npm run audit:policy-check
      - name: Clean install exactly locked dependencies (no deployment)
        run: npm ci --no-audit --no-fund
      - name: Audit locked production dependencies (moderate or higher blocks CI)
        run: npm run audit:prod
      - name: Audit all locked dependencies (high or critical blocks CI)
        run: npm run audit:all
      - name: Test connected-device installer safely with mocked ADB and Gradle
        run: npm run android:device-tests
      - name: Node API and design-guard fixture tests
        run: npm test
      - name: Apply catalog D1 migrations locally (no remote resources)
        run: npm run db:migrate:local
      - name: Bundle local D1 Worker (never deploy)
        run: npm run db:build:local
      - name: Exercise isolated local workerd and D1 over HTTP (never deploy)
        run: npm run test:workerd:local
      - name: TypeScript strict checks
        run: npm run typecheck
      - name: Install JDK 17 for nonvisual Kotlin protocol checks
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Gradle for Android-compatible Kotlin Core
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.10.2'
      - name: Compile Kotlin networking core and execute real JVM contract tests (no Android SDK or deployment)
        run: gradle -p apps/android :core:verifyHeadlessCore --no-daemon
      - name: Wrangler bundle check (no deployment)
        run: npm run build:api
